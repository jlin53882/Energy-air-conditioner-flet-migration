<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HVAC UI · 引導卡片</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#18293a;font:15px/1.5 system-ui,"Segoe UI",sans-serif}.shell{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid #dce4ed}.brand{font-weight:750}.nav{display:flex;gap:8px}.nav button,.mode-card,.action{font:inherit;cursor:pointer;border:1px solid #cfdae6;background:#fff;color:#31475a;border-radius:10px;padding:10px 14px}.nav .on,.mode-card.on{border-color:#2b78b9;background:#eaf4fc;color:#155b91}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;margin-top:20px}.main,.aside{background:#fff;border:1px solid #dde5ed;border-radius:16px;padding:22px}.kicker{color:#71869b;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.title{font-size:26px;font-weight:750;margin:3px 0 5px}.sub{color:#63778b}.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 12px}.mode-card{text-align:left;min-height:82px}.mode-card strong{display:block;font-size:15px;margin-bottom:3px}.mode-card span{font-size:13px;color:#6a7d90}.active-banner{display:flex;align-items:center;gap:10px;padding:12px;background:#eef7f1;border:1px solid #d4eadb;border-radius:10px;margin:12px 0 18px}.dot{width:9px;height:9px;background:#2b9a5b;border-radius:50%}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{background:#f9fbfd;border:1px solid #e0e7ee;border-radius:11px;padding:14px}.field label{display:block;font-size:13px;color:#596f84;margin-bottom:8px}.control{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px}.control input,.control select{height:42px;border:1px solid #cad6e2;border-radius:8px;padding:0 11px;font:inherit;background:white;min-width:0}.state-row{display:grid;grid-template-columns:150px minmax(90px,1fr) 100px;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf1f5}.state-row:last-child{border-bottom:0}.state-row input,.state-row select{height:40px;border:1px solid #cad6e2;border-radius:8px;padding:0 10px;font:inherit;background:#fff;min-width:0}.state-label{font-size:13px;color:#4c647a}.note{padding:12px 14px;background:#fff8e8;border:1px solid #f1dfae;border-radius:10px;color:#725719;margin-top:14px}.pending-add{margin-top:14px;border:1px dashed #aab7c4;border-radius:9px;background:#f6f8fa;color:#758596;padding:9px 14px;font:inherit;cursor:not-allowed}.primary{margin-top:16px;background:#1768a8;color:white;border:0;border-radius:9px;padding:11px 17px;font:inherit;font-weight:700}.aside h3{margin:0 0 8px}.aside p{color:#62768a;font-size:13px}.view,.fields-mode{display:none}.view.active,.fields-mode.active{display:block}.tiny{color:#8192a3;font-size:12px;margin-top:14px}
@media(max-width:760px){.shell{padding:12px}.top{align-items:flex-start;flex-direction:column;gap:12px}.nav{width:100%}.nav button{flex:1}.layout{grid-template-columns:1fr}.main,.aside{padding:16px}.title{font-size:22px}.modes,.field-grid{grid-template-columns:1fr}.state-row{grid-template-columns:1fr 1fr;gap:8px}.state-label{grid-column:1/-1}.state-row select:last-child{grid-column:1/-1}.aside{order:2}}
</style></head><body><div class="shell"><header class="top"><div class="brand">HVAC · Engineering Workspace</div><nav class="nav"><button class="on" data-view="psy">濕空氣性質</button><button data-view="state">狀態查詢</button></nav></header><main class="layout"><section class="main">
<div id="psy" class="view active"><div class="kicker">分析模式</div><div class="title">濕空氣性質</div><div class="sub">選擇一種已知條件組合，輸入區會同步切換。</div><div class="modes"><button class="mode-card on" data-mode="twb"><strong>乾球＋濕球</strong><span>已知 Tdb 與 Twb</span></button><button class="mode-card" data-mode="rh"><strong>乾球＋相對濕度</strong><span>已知 Tdb 與 RH</span></button></div><div class="active-banner"><span class="dot"></span><span>目前模式：<strong id="current-mode">已知乾球＋濕球</strong></span></div>
<div class="fields-mode active" id="fields-twb"><div class="field-grid"><div class="field"><label>乾球溫度 · Tdb</label><div class="control"><input value="25"><select><option>°C</option></select></div></div><div class="field"><label>濕球溫度 · Twb</label><div class="control"><input value="20"><select><option>°C</option></select></div></div><div class="field"><label>高度</label><div class="control"><input value="0"><select><option>m</option></select></div></div></div></div><div class="fields-mode" id="fields-rh"><div class="field-grid"><div class="field"><label>乾球溫度 · Tdb</label><div class="control"><input value="25"><select><option>°C</option></select></div></div><div class="field"><label>相對濕度 · RH</label><div class="control"><input value="50"><select><option>%</option></select></div></div><div class="field"><label>高度</label><div class="control"><input value="0"><select><option>m</option></select></div></div></div></div><button class="primary">執行分析</button></div>
<div id="state" class="view"><div class="kicker">已知條件</div><div class="title">狀態查詢 · 焓</div><div class="sub">每列等高；標籤、數值與單位固定對齊。</div><div class="state-row"><span class="state-label">已知性質 1</span><select><option>Pressure (壓力)</option></select><input value="100"><select><option>kPa</option></select></div><div class="state-row"><span class="state-label">已知性質 2</span><select><option>Enthalpy (焓)</option></select><input value="250"><select><option>kJ/kg</option></select></div><button class="pending-add" disabled title="第三條件限制尚未支援">＋ 新增條件</button><div class="note">目前求解仍只接受兩個獨立性質；此入口暫停使用，待第三條件限制支援後再開放。</div><button class="primary">執行計算</button></div>
</section><aside class="aside"><h3>引導式選擇</h3><p>模式以可選卡片呈現，選中卡片、狀態提示與可見欄位一致。狀態查詢保留兩條清楚對齊的條件列，不提供不支援的第三條件操作。</p><div class="tiny">示意值不代表實際計算結果。</div></aside></main></div><script>
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===b.dataset.view))});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.fields-mode').forEach(x=>x.classList.toggle('active',x.id==='fields-'+b.dataset.mode));document.getElementById('current-mode').textContent=b.dataset.mode==='twb'?'已知乾球＋濕球':'已知乾球＋相對濕度'});
</script></body></html>
