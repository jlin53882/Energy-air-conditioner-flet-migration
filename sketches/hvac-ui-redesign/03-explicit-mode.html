<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HVAC UI · 模式明示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#172635;font:15px/1.5 system-ui,"Segoe UI",sans-serif}.frame{max-width:1160px;margin:0 auto;padding:20px}.header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:750}.nav{display:flex;gap:6px;background:#e8edf2;padding:4px;border-radius:11px}.nav button{border:0;background:transparent;padding:9px 14px;border-radius:8px;color:#53687b;font:inherit;cursor:pointer}.nav button.on{background:#fff;color:#145f9a;box-shadow:0 1px 4px #1b355022;font-weight:700}.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;margin-top:18px}.content,.context{background:#fff;border:1px solid #dce4eb;border-radius:14px;padding:22px}.title{font-size:25px;font-weight:760;margin:0}.intro{color:#62778b;margin:4px 0 18px}.mode-label{font-size:13px;color:#60758a;margin-bottom:8px}.mode-switch{display:flex;border:1px solid #d4dee7;border-radius:11px;padding:5px;gap:6px;background:#f8fafc}.mode-switch button{flex:1;border:0;border-radius:8px;background:transparent;text-align:left;padding:11px 13px;cursor:pointer;color:#40566c;font:inherit}.mode-switch button.on{background:#145f9a;color:#fff;box-shadow:0 2px 5px #145f9a33}.mode-switch small{display:block;opacity:.78}.now{margin:12px 0 16px;font-weight:650;color:#145f9a}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{border-bottom:1px solid #e8edf2;padding:10px 2px 14px}.field label{display:block;color:#51677d;font-size:13px;margin-bottom:7px}.control{display:flex;gap:8px}.control input,.control select{height:42px;border:1px solid #cbd6e0;border-radius:7px;background:#fff;padding:0 10px;font:inherit;min-width:0}.control input{flex:1}.control select{width:100px}.action{border:0;border-radius:8px;padding:11px 17px;background:#155f98;color:#fff;font:inherit;font-weight:700;margin-top:16px;cursor:pointer}.view,.inputs{display:none}.view.active,.inputs.active{display:block}.status-row{display:grid;grid-template-columns:160px minmax(80px,1fr) 120px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #e7edf1}.status-row select,.status-row input{height:42px;border:1px solid #cbd6e0;border-radius:7px;background:#fff;padding:0 10px;font:inherit;min-width:0}.property{font-weight:650}.context h3{margin:0 0 8px}.context p{font-size:13px;color:#63788c;margin:0}.notice{margin-top:14px;padding:12px;background:#f5f7f9;border-radius:8px;color:#64778a}.viewhead{display:flex;justify-content:space-between;align-items:start;gap:12px}
@media(max-width:760px){.frame{padding:11px}.header{align-items:flex-start;flex-direction:column}.nav{width:100%}.nav button{flex:1}.layout{grid-template-columns:1fr}.content,.context{padding:16px}.viewhead{flex-direction:column}.mode-switch{flex-direction:column}.mode-switch button{width:100%}.form{grid-template-columns:1fr}.status-row{grid-template-columns:1fr 1fr}.property{grid-column:1/-1}.status-row select:last-child{grid-column:1/-1}.context{order:2}.title{font-size:22px}}
</style></head><body><div class="frame"><header class="header"><div class="brand">THERMO · HVAC 工作區</div><nav class="nav"><button class="on" data-view="psy">濕空氣性質</button><button data-view="state">狀態查詢</button></nav></header><main class="layout"><section class="content">
<div id="psy" class="view active"><div class="viewhead"><div><h1 class="title">濕空氣性質</h1><p class="intro">目前採用的計算模式會明確標示。</p></div></div><div class="mode-label">分析模式</div><div class="mode-switch"><button class="on" data-mode="twb">已知乾球＋濕球<small>Tdb 與 Twb</small></button><button data-mode="rh">已知乾球＋相對濕度<small>Tdb 與 RH</small></button></div><div class="now">現在使用：<span id="current-mode">已知乾球＋濕球</span></div><div class="inputs active" id="inputs-twb"><div class="form"><div class="field"><label>乾球溫度 (Tdb)</label><div class="control"><input value="25"><select><option>°C</option></select></div></div><div class="field"><label>濕球溫度 (Twb)</label><div class="control"><input value="20"><select><option>°C</option></select></div></div><div class="field"><label>高度 (Altitude)</label><div class="control"><input value="0"><select><option>m</option></select></div></div></div></div><div class="inputs" id="inputs-rh"><div class="form"><div class="field"><label>乾球溫度 (Tdb)</label><div class="control"><input value="25"><select><option>°C</option></select></div></div><div class="field"><label>相對濕度 (RH)</label><div class="control"><input value="50"><select><option>%</option></select></div></div><div class="field"><label>高度 (Altitude)</label><div class="control"><input value="0"><select><option>m</option></select></div></div></div></div><button class="action">執行分析</button></div>
<div id="state" class="view"><h1 class="title">狀態查詢 · 焓</h1><p class="intro">輸入兩個已知性質，並以同一欄位列對齊。</p><div class="status-row"><span class="property">已知性質 1</span><select><option>Pressure · 壓力</option></select><input value="100"><select><option>kPa</option></select></div><div class="status-row"><span class="property">已知性質 2</span><select><option>Enthalpy · 焓</option></select><input value="250"><select><option>kJ/kg</option></select></div><div class="notice">第三限制條件尚未支援，因此新增控制項暫不顯示。現階段只接受兩個獨立性質。</div><button class="action">執行計算</button></div>
</section><aside class="context"><h3>模式／條件契約</h3><p>使用強烈但克制的選中態與第二行「現在使用」文字。狀態查詢以固定三欄軌道排列性質、數值和單位，窄螢幕自動改為上下順序。</p></aside></main></div><script>
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===b.dataset.view))});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.inputs').forEach(x=>x.classList.toggle('active',x.id==='inputs-'+b.dataset.mode));document.getElementById('current-mode').textContent=b.childNodes[0].textContent.trim()});
</script></body></html>
