<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HVAC UI · 狀態優先</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172536;font:15px/1.5 system-ui,"Segoe UI",sans-serif}.shell{max-width:1180px;margin:0 auto;padding:20px}.bar,.panel,.side{background:#fff;border:1px solid #dce4ed;border-radius:14px}.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;gap:12px}.brand{font-weight:700}.nav{display:flex;gap:8px}.nav button,.mode button,.action{border:1px solid #cbd7e4;background:#fff;color:#31465a;border-radius:9px;padding:9px 13px;cursor:pointer;font:inherit}.nav .on,.mode .on{background:#e8f1ff;border-color:#3278c7;color:#145da5;font-weight:700}.unit{color:#607286;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;margin-top:16px}.panel{padding:22px}.heading{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:16px}.eyebrow{font-size:12px;color:#708196}.title{font-size:25px;font-weight:750;margin:2px 0}.hint{color:#61758a}.mode{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.mode button{min-width:190px}.mode-now{background:#f5f8fc;border-radius:9px;padding:10px 12px;color:#52677d;margin-bottom:16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{border:1px solid #dce4ed;border-radius:10px;padding:13px}.field label{display:block;font-size:13px;color:#536b82;margin-bottom:7px}.control{display:flex;gap:8px}.control input,.control select{height:42px;border:1px solid #cbd7e4;border-radius:7px;background:white;padding:0 10px;font:inherit;min-width:0}.control input{flex:1}.control select{width:105px}.notice{margin-top:14px;padding:11px 13px;border-left:3px solid #91a9c1;background:#f6f8fa;color:#5c7083;border-radius:4px}.side{padding:17px;height:max-content}.side h3{margin:0 0 8px}.side p{color:#66788b;font-size:13px;margin:0}.section{margin-top:20px}.primary{margin-top:16px;background:#1769aa;color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:650}.view{display:none}.view.active{display:block}.mode-fields{display:none}.mode-fields.active{display:block}.samples{font-size:12px;color:#71849a;border-top:1px solid #e7edf3;margin-top:16px;padding-top:12px}
@media(max-width:760px){.shell{padding:10px}.bar{align-items:flex-start;flex-direction:column}.nav{width:100%}.nav button{flex:1}.layout{grid-template-columns:1fr}.side{order:2}.panel{padding:16px}.heading{flex-direction:column}.mode button{flex:1;min-width:0}.fields{grid-template-columns:1fr}.control input{width:100%}.title{font-size:22px}}
</style></head><body><div class="shell">
<header class="bar"><div class="brand">熱力學工程工作區</div><nav class="nav"><button class="on" data-view="psy">濕空氣性質</button><button data-view="state">狀態查詢</button></nav><div class="unit">輸出單位　SI</div></header>
<main class="layout"><section class="panel">
<div class="view active" id="psy"><div class="heading"><div><div class="eyebrow">空氣處理 · Psychrometrics</div><div class="title">濕空氣性質</div><div class="hint">先選擇輸入方式；目前模式會清楚標示。</div></div></div>
<div class="mode" role="tablist"><button class="on" data-mode="twb">已知乾球＋濕球</button><button data-mode="rh">已知乾球＋相對濕度</button></div><div class="mode-now">目前分析模式：<strong id="current-mode">已知乾球＋濕球</strong></div>
<div class="mode-fields active" id="fields-twb"><div class="fields"><div class="field"><label>乾球溫度 (Tdb)</label><div class="control"><input value="25"><select><option>°C</option></select></div></div><div class="field"><label>濕球溫度 (Twb)</label><div class="control"><input value="20"><select><option>°C</option></select></div></div><div class="field"><label>高度</label><div class="control"><input value="0"><select><option>m</option></select></div></div></div></div>
<div class="mode-fields" id="fields-rh"><div class="fields"><div class="field"><label>乾球溫度 (Tdb)</label><div class="control"><input value="25"><select><option>°C</option></select></div></div><div class="field"><label>相對濕度 (RH)</label><div class="control"><input value="50"><select><option>%</option></select></div></div><div class="field"><label>高度</label><div class="control"><input value="0"><select><option>m</option></select></div></div></div></div><button class="primary">執行分析</button>
</div>
<div class="view" id="state"><div class="heading"><div><div class="eyebrow">Thermodynamics</div><div class="title">狀態查詢 · 焓</div><div class="hint">設定兩個已知獨立性質以求解狀態。</div></div></div><div class="fields"><div class="field"><label>已知性質 1</label><div class="control"><select><option>Pressure (壓力)</option></select><input value="100"><select><option>kPa</option></select></div></div><div class="field"><label>已知性質 2</label><div class="control"><select><option>Enthalpy (焓)</option></select><input value="250"><select><option>kJ/kg</option></select></div></div></div><div class="notice">目前只支援兩個獨立性質；第三條件尚未支援，因此暫不顯示新增條件按鈕。</div><button class="primary">執行計算</button></div>
</section><aside class="side"><h3>設計重點</h3><p>模式選中態直接反映在按鈕，並同步顯示「目前分析模式」。狀態查詢第三條件入口完全隱藏，避免引導輸入尚不支援的限制條件。</p><div class="samples">此為布局示意；欄位和數值僅作視覺示例，不代表計算結果。</div></aside></main></div>
<script>
const views=document.querySelectorAll('.view');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x===b));views.forEach(v=>v.classList.toggle('active',v.id===b.dataset.view))});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.mode-fields').forEach(x=>x.classList.toggle('active',x.id==='fields-'+b.dataset.mode));document.getElementById('current-mode').textContent=b.textContent});
</script></body></html>
