name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.7.5"
          python-version: "3.12"
          enable-cache: true

      - name: Check lockfile
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check application chart infrastructure run.py

      - name: Compile Python sources
        run: >-
          uv run python -m compileall -q
          Flet_ui Telegram_bot application domain chart infrastructure
          run.py telegeram_chatid.py

      - name: Check installed dependencies
        run: uv pip check

      - name: Check revision whitespace
        run: git diff --check HEAD^1 HEAD

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.7.5"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run test suite
        run: uv run pytest -q
