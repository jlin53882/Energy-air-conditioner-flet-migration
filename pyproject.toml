[project]
name = "energy-air-conditioner"
version = "0.1.0"
description = "Tkinter-free Flet migration of the Energy Air Conditioner application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "coolprop>=7.1.0",
    "dotenv>=0.9.9",
    "flet-charts>=1.0.0",
    "flet[all]==1.0.0",
    "matplotlib>=3.10.7",
    "nuitka>=2.8.4",
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
    "python-telegram-bot>=22.5",
    "requests>=2.32.5",
    "sccache>=0.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
